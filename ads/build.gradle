apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 100
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        productFlavors {
        }
        buildTypes {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding = true
    }

    namespace 'com.lmt.lmtech.ads'
}


dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.material

    implementation "androidx.lifecycle:lifecycle-extensions:2.0.0"
    implementation libs.androidx.lifecycle.runtime.ktx

    api libs.shimmer
    api libs.androidx.multidex
    api libs.play.services.ads
    api libs.play.services.ads.identifier

    // Billing
    api libs.billing.ktx
    api libs.guava

    //Firebase
    api platform(libs.firebase.bom)
    api libs.bundles.firebase

    // Mediation
    implementation 'com.google.ads.mediation:facebook:6.17.0.0'
    implementation 'com.google.ads.mediation:applovin:13.5.0.0'
    implementation 'com.google.ads.mediation:vungle:7.4.0.1'
    implementation("com.google.ads.mediation:mintegral:16.9.41.0")
    implementation("com.google.ads.mediation:pangle:6.5.0.4.0")
    implementation("com.google.ads.mediation:inmobi:10.8.0.0")
    implementation("com.unity3d.ads:unity-ads:4.13.0")
    implementation("com.google.ads.mediation:unity:4.13.0.0")

    // Facebook SDK
    implementation 'com.facebook.android:facebook-android-sdk:17.0.1'

    // Adjust
    implementation 'com.adjust.sdk:adjust-android:5.0.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation("com.jakewharton.threetenabp:threetenabp:1.4.6")

    // Lottie
    implementation libs.lottie

    // Sdp & Ssp
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.0'
    // Tiktok SDK
    implementation 'com.github.tiktok:tiktok-business-android-sdk:1.3.8' // rep
}
